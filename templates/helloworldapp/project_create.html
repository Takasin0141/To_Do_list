{% extends 'helloworldapp/base.html' %}
{% load static %}

{% block content %}
<div class="page-header">
    <h1><i class="fas fa-plus-circle"></i> {{ page_title|default:"新しいプロジェクトを作成" }}</h1>
</div>

{% if messages %}
<ul class="messages">
    {% for message in messages %}
    <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}

<div class="form-container">
    <form method="post" class="project-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="name" class="form-label">
                <i class="fas fa-folder"></i> プロジェクト名 <span class="required">*</span>
            </label>
            <input type="text" id="name" name="name" class="form-control-vivid" required 
                   placeholder="プロジェクト名を入力してください" maxlength="100">
        </div>
        
        <div class="form-group">
            <label for="description" class="form-label">
                <i class="fas fa-align-left"></i> 説明
            </label>
            <textarea id="description" name="description" class="form-control-vivid" rows="4" 
                      placeholder="プロジェクトの説明を入力してください（任意）"></textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn-gradient">
                <i class="fas fa-save"></i> プロジェクトを作成
            </button>
            <a href="{% url 'helloworldapp:project_list_view' %}" class="btn-cancel">
                <i class="fas fa-times"></i> キャンセル
            </a>
        </div>
    </form>
</div>
{% endblock %}
