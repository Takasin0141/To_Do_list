{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title|default:"ログイン" }} - TaskFlow</title>
    <link rel="stylesheet" href="{% static 'helloworldapp/css/styles.css' %}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f7f6;
            font-family: 'Roboto', sans-serif;
        }
        .login-container {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 25px;
            color: #333;
            font-weight: 500;
        }
        .login-container form p { /* {{ form.as_p }} が生成するpタグ用 */
            margin-bottom: 15px;
            text-align: left;
        }
        .login-container form label { /* {{ form.as_p }} が生成するlabelタグ用 */
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        .login-container form input[type="text"],
        .login-container form input[type="password"] { /* {{ form.as_p }} が生成するinputタグ用 */
            width: calc(100% - 22px); /* paddingとborderを考慮 */
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .login-container form ul.errorlist { /* Djangoフォームが出力するエラーリスト用 */
            list-style-type: none;
            padding: 0;
            color: red;
            font-size: 0.9em;
            margin-top: 5px;
            margin-bottom: 10px; /* エラーリストの下に少しマージン */
            text-align: left;
        }
        .login-container button[type="submit"] {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
            transition: background-color 0.3s ease;
            margin-top: 10px; /* ボタンの上のマージン調整 */
        }
        .login-container button[type="submit"]:hover {
            background-color: #0056b3;
        }
        .login-container .links {
            margin-top: 20px;
            font-size: 0.9em;
        }
        .login-container .links a {
            color: #007bff;
            text-decoration: none;
        }
        .login-container .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>{{ page_title|default:"ログイン" }}</h2>
        <form method="post" action="{% url 'helloworldapp:login_view' %}">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <ul class="errorlist nonfield">
                    {% for error in form.non_field_errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            {% endif %}

            {{ form.as_p }}

            <button type="submit">ログイン</button>
        </form>
        <div class="links">
            <a href="{% url 'helloworldapp:signup_view' %}">新規登録はこちら</a>
        </div>
    </div>
</body>
</html>
