{% extends "helloworldapp/base.html" %}
{% load static %}

{% block title %}カレンダー{% endblock title %}

{% block head_extra %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.css' rel='stylesheet' />
<style>
.calendar-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: var(--space-8);
}

.calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-8);
    padding-bottom: var(--space-6);
    border-bottom: 1px solid var(--gray-200);
}

.calendar-title {
    font-size: var(--font-size-3xl);
    font-weight: var(--font-weight-bold);
    color: var(--gray-900);
    display: flex;
    align-items: center;
    gap: var(--space-3);
}

.calendar-actions {
    display: flex;
    gap: var(--space-4);
}

.btn-primary {
    background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
    color: var(--white);
    border: none;
    padding: var(--space-3) var(--space-6);
    border-radius: var(--radius-lg);
    font-weight: var(--font-weight-semibold);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    transition: all var(--transition-fast);
    cursor: pointer;
}

.btn-primary:hover {
    background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
}

.calendar-wrapper {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-2xl);
    padding: var(--space-8);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
}

#calendar {
    width: 100%;
    height: 600px;
}

/* FullCalendar カスタマイズ */
.fc {
    font-family: 'Inter', sans-serif;
}

.fc-header-toolbar {
    margin-bottom: var(--space-6);
}

.fc-button {
    background: var(--primary-500) !important;
    border: none !important;
    border-radius: var(--radius-lg) !important;
    font-weight: var(--font-weight-semibold) !important;
    padding: var(--space-2) var(--space-4) !important;
    transition: all var(--transition-fast) !important;
}

.fc-button:hover {
    background: var(--primary-600) !important;
    transform: translateY(-2px) !important;
    box-shadow: var(--shadow-md) !important;
}

.fc-button:focus {
    box-shadow: 0 0 0 3px var(--primary-100) !important;
}

.fc-today-button {
    background: var(--gray-100) !important;
    color: var(--gray-700) !important;
}

.fc-today-button:hover {
    background: var(--gray-200) !important;
}

.fc-event {
    border-radius: var(--radius-lg) !important;
    border: none !important;
    padding: var(--space-1) var(--space-2) !important;
    font-size: var(--font-size-sm) !important;
    font-weight: var(--font-weight-medium) !important;
}

.fc-daygrid-event {
    margin: 1px 0 !important;
}

.fc-event-title {
    font-weight: var(--font-weight-semibold) !important;
}

.fc-daygrid-day-number {
    font-weight: var(--font-weight-medium) !important;
    color: var(--gray-700) !important;
}

.fc-col-header-cell {
    background: var(--gray-50) !important;
    font-weight: var(--font-weight-semibold) !important;
    color: var(--gray-700) !important;
    text-transform: uppercase !important;
    letter-spacing: 0.05em !important;
    font-size: var(--font-size-sm) !important;
}

.fc-daygrid-day {
    border-color: var(--gray-200) !important;
}

.fc-daygrid-day:hover {
    background: var(--gray-50) !important;
}

.fc-day-today {
    background: var(--primary-50) !important;
}

.fc-day-today .fc-daygrid-day-number {
    color: var(--primary-700) !important;
    font-weight: var(--font-weight-bold) !important;
}

/* イベントの色分け */
.event-pending {
    background: linear-gradient(135deg, #ff9800, #f57c00) !important;
}

.event-in_progress {
    background: linear-gradient(135deg, #2196f3, #1976d2) !important;
}

.event-completed {
    background: linear-gradient(135deg, #4caf50, #45a049) !important;
}

.event-on_hold {
    background: linear-gradient(135deg, #9e9e9e, #757575) !important;
}
</style>
{% endblock head_extra %}

{% block content %}
<div class="calendar-container">
    <div class="calendar-header">
        <h1 class="calendar-title">
            <i class="fas fa-calendar"></i> カレンダー
        </h1>
        <div class="calendar-actions">
            <a href="{% url 'helloworldapp:main_page' %}" class="btn-primary">
                <i class="fas fa-plus"></i> タスクを追加
            </a>
        </div>
    </div>
    
    <div class="calendar-wrapper">
        <div id="calendar"></div>
    </div>
</div>
{% endblock content %}

{% block scripts_extra %}
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.js'></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ja',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,dayGridWeek,listWeek'
        },
        buttonText: {
            today: '今日',
            month: '月',
            week: '週',
            list: 'リスト'
        },
        events: {{ events_list|safe }},
        eventClick: function(info) {
            if (info.event.url) {
                window.location.href = info.event.url;
            }
        },
        eventMouseEnter: function(info) {
            info.el.style.transform = 'scale(1.05)';
            info.el.style.transition = 'transform 0.2s ease';
        },
        eventMouseLeave: function(info) {
            info.el.style.transform = 'scale(1)';
        }
    });
    calendar.render();
});
</script>
{% endblock scripts_extra %}
